name: Feature request
description: Propose a focused, agent-oriented docx-tool improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Agent workflow problem
      description: Describe the concrete workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include suggested CLI syntax and structured output when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This can remain independent of sibling tools and remote services.
          required: true
        - label: Any example DOCX will be synthetic or redistributable.
          required: true
